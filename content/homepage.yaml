- id: config
  hero:
    title: Building ML and AI systems
    description: I'm an AI/ML Engineer at Xebia who enjoys solving practical problems with well-engineered systems. My work spans machine learning, AI, and infrastructure, with an emphasis on finding solutions that fit the problem and the constraints they need to work within.
    portrait_alt: Portrait of Max van den Hoven
  about:
    title: A bit about me
    lede: I enjoy solving problems where I can see the impact of what I build.
    # Paragraphs support inline links: [text](https://...)
    paragraphs:
      - I care about engineering things well, but try to keep that ambition grounded in what the work needs to achieve. A straightforward solution can be the right one if it solves the problem within the available time, budget, and practical constraints, even without the newest technology or a complex architecture.
      - Side projects give me a fun setting to explore technology and develop skills I can bring back to work. I enjoy building in the open and sharing what I learn through writing and talks, as well as helping people learn from each other as a co-organizer of the [Eindhoven Data Community](https://www.meetup.com/nl-nl/eindhoven-data-community/).
      - I also enjoy running and completed my first marathon in 2026 (and yes, it was hard).
    education:
