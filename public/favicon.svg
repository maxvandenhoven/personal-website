<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!-- Same mark as src/components/ui/Logo.tsx. In dark mode the paper turns to
       dark ink and the shadow becomes a full disc of the same ink (it can
       extend past the sun unseen), leaving a clean orange crescent. -->
  <style>
    .paper { fill: #F8F6F1; }
    .sun { fill: #FF6C2F; }
    .shadow { fill: #1E1B1A; }
    .moon { display: none; fill: #1E1B1A; }
    @media (prefers-color-scheme: dark) {
      .paper { fill: #1E1B1A; }
      .shadow { display: none; }
      .moon { display: inline; }
    }
  </style>
  <rect class="paper" width="32" height="32" rx="8"/>
  <circle class="sun" cx="16" cy="16" r="10.5"/>
  <path class="shadow" d="M16.67 5.22A10.8 10.8 0 0 1 23.14 24.1A10.5 10.5 0 0 1 16.67 5.22Z"/>
  <circle class="moon" cx="23" cy="13.6" r="10.5"/>
</svg>
