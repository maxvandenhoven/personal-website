<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Artwork preview</title>
    <!--palette-->
    <style>
      :root {
        color-scheme: light;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        padding: 24px 16px 64px;
        background: #f3f2ee;
        color: #17181d;
        font:
          14px/1.5 ui-sans-serif,
          system-ui,
          sans-serif;
      }
      main {
        display: flex;
        flex-direction: column;
        gap: 28px;
        max-width: 720px;
        margin: 0 auto;
      }
      h1 {
        margin: 0;
        font:
          500 13px ui-monospace,
          Menlo,
          monospace;
        word-break: break-all;
      }
      h2 {
        margin: 0 0 8px;
        font:
          500 11px ui-monospace,
          Menlo,
          monospace;
        letter-spacing: 0.12em;
        text-transform: uppercase;
        color: #5b5e68;
      }
      .controls {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: 12px;
      }
      .controls label {
        display: flex;
        align-items: center;
        gap: 6px;
      }
      button,
      select {
        font: inherit;
        padding: 4px 10px;
        border: 1px solid #dedcd5;
        border-radius: 8px;
        background: #fbfaf8;
        color: inherit;
        cursor: pointer;
      }
      input[type="range"] {
        width: 200px;
      }
      output {
        min-width: 7ch;
        font-family: ui-monospace, Menlo, monospace;
      }
      .frame {
        overflow: hidden;
        background: var(--color-art);
        outline: 1px solid #dedcd5;
        outline-offset: -1px;
        border-radius: 10px;
      }
      .frame canvas {
        display: block;
        width: 100%;
        height: 100%;
      }
      .card {
        width: 100%;
        max-width: 520px;
        aspect-ratio: 16 / 9;
      }
      .article {
        width: 100%;
        max-width: 656px;
        aspect-ratio: 16 / 9;
      }
      .glyph-small {
        width: 40px;
        height: 40px;
        border-radius: 6px;
      }
      .glyph-large {
        width: 160px;
        height: 160px;
      }
      .row {
        display: flex;
        flex-wrap: wrap;
        align-items: flex-end;
        gap: 16px;
      }
      .timeline {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
        gap: 12px;
      }
      .timeline figure {
        margin: 0;
      }
      .timeline figcaption {
        margin-top: 4px;
        font:
          11px ui-monospace,
          Menlo,
          monospace;
        color: #5b5e68;
      }
      [data-kind="card"] .only-glyph,
      [data-kind="glyph"] .only-card,
      [data-kind="glyph"] .timeline .frame {
        display: none;
      }
      [data-kind="glyph"] .timeline .frame.glyph-small {
        display: block;
      }
      #errors {
        padding: 12px;
        border-radius: 8px;
        background: #fbeae6;
        color: #8c2a18;
        font:
          12px/1.5 ui-monospace,
          Menlo,
          monospace;
        white-space: pre-wrap;
      }
      #errors:empty {
        display: none;
      }
    </style>
  </head>
  <body data-kind="{{KIND}}">
    <main>
      <header>
        <h1>{{TITLE}}</h1>
      </header>
      <div id="errors" role="alert"></div>
      <div class="controls">
        <button id="play" type="button">Pause</button>
        <button id="restart" type="button">Restart</button>
        <label>
          Speed
          <select id="speed">
            <option value="0.25">0.25×</option>
            <option value="0.5">0.5×</option>
            <option value="1" selected>1×</option>
            <option value="2">2×</option>
            <option value="4">4×</option>
          </select>
        </label>
        <label>
          Time
          <input
            id="scrub"
            type="range"
            min="0"
            max="60"
            step="0.05"
            value="0"
          />
        </label>
        <output id="clock">0.0 s</output>
        <label>
          Shape
          <select id="kind">
            <option value="card">Card and article (16:9)</option>
            <option value="glyph">Skill glyph (square)</option>
          </select>
        </label>
      </div>

      <section class="only-card">
        <h2>Card, 520 px</h2>
        <div class="frame card"><canvas id="card"></canvas></div>
      </section>
      <section class="only-card">
        <h2>Article column, 656 px</h2>
        <div class="frame article"><canvas id="article"></canvas></div>
      </section>
      <section class="only-glyph">
        <h2>Skill glyph, 40 px and 160 px</h2>
        <div class="row">
          <div class="frame glyph-small">
            <canvas id="glyph-small"></canvas>
          </div>
          <div class="frame glyph-large">
            <canvas id="glyph-large"></canvas>
          </div>
        </div>
      </section>
      <section>
        <h2>
          Timeline, one frame every
          <select id="step">
            <option value="0.5">0.5 s</option>
            <option value="1">1 s</option>
            <option value="1.5" selected>1.5 s</option>
            <option value="3">3 s</option>
            <option value="6">6 s</option>
          </select>
        </h2>
        <div id="timeline" class="timeline"></div>
      </section>
    </main>
    <script type="module" src="viewer.js"></script>
    {{RELOAD}}
  </body>
</html>
